services:
  abo-pilot:
    build: .
    container_name: abo-pilot
    restart: unless-stopped
    environment:
      ABO_BASIC_AUTH_USER: "${ABO_BASIC_AUTH_USER:-}"
      ABO_BASIC_AUTH_PASSWORD: "${ABO_BASIC_AUTH_PASSWORD:-}"
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - abo-pilot-analysis

  abo-pilot-analysis:
    build:
      context: .
      dockerfile: Dockerfile.analysis
    container_name: abo-pilot-analysis
    restart: unless-stopped
    environment:
      PORT: "8787"
      ENABLE_OLLAMA: "${ENABLE_OLLAMA:-false}"
      ANALYSIS_TIMEOUT_MS: "${ANALYSIS_TIMEOUT_MS:-20000}"
      SMTP_HOST: "${SMTP_HOST:-smtp.hostinger.com}"
      SMTP_PORT: "${SMTP_PORT:-465}"
      SMTP_SECURE: "${SMTP_SECURE:-true}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      MAIL_REPLY_TO: "${MAIL_REPLY_TO:-}"
